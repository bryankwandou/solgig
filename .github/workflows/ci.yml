name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Placeholder so the build's import-time DATABASE_URL check passes;
          # nothing connects to it during a build.
          DATABASE_URL: postgres://placeholder:placeholder@placeholder.neon.tech/db
          SESSION_SECRET: ci-only-not-a-real-secret-0123456789
